name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package extension ZIP
        run: |
          ZIPNAME="acps-workflow-${{ steps.meta.outputs.version }}.zip"
          zip -r "$ZIPNAME" . \
            -x ".git/*" ".github/*" ".gitignore" "tests/*" "docs/*" \
               "CONTRIBUTING.md" "node_modules/*" "package.json" \
               "package-lock.json" ".npmignore" ".DS_Store"
          echo "ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIPNAME }}
          generate_release_notes: true
