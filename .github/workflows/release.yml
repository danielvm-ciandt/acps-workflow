name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from extension.yml
        id: meta
        run: |
          VERSION=$(grep 'version:' extension.yml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package extension ZIP
        run: |
          ZIPNAME="acps-workflow-${{ steps.meta.outputs.version }}.zip"
          zip -r "$ZIPNAME" . \
            -x ".git/*" ".github/*" ".gitignore" "tests/*" "docs/*" \
               "CONTRIBUTING.md" "node_modules/*" "package.json" \
               "package-lock.json" ".npmignore" ".DS_Store"
          echo "ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIPNAME }}
          generate_release_notes: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
