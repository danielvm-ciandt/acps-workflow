# ACPS Workflow Configuration
# Copy to acps-config.yml and customize for your project.

project:
  name: ""
  team: ""

artifacts:
  specs_root: "specs"
  backlog_path: "specs/BACKLOG.md"
  release_plan_path: "specs/RELEASE_PLAN.md"
  changelog_path: "CHANGELOG.md"
  test_summary_path: "specs/TEST_SUMMARY.md"
  project_status_path: "specs/project/PROJECT_STATUS.md"

quality_gates:
  require_test_before_uat: true
  require_uat_before_docs: true

counting:
  default_mode: "full"          # full | simplified | fp-snap
  maturity_threshold_bcp: 20    # BCP total for 100% maturity score
  maturity_threshold_fp: 50     # FP+SNAP total for 100% maturity score
  auto_count_after_spec: true

# LLM Efficiency Settings
# These values were derived from a 5-iteration autoresearch exercise on the spec-kit SDD sample.
# They reduce token usage by ~60% and wall-clock time by ~27% while keeping val_bpb < 1.90.
llm_efficiency:
  token_budget: 1000              # Strict token cap per LLM call
  early_stop_patience: 1          # Stop if no improvement for N validation checks
  use_lora_adapters: true         # Use lightweight LoRA adapters instead of full-model updates
  prompt_reuse: true              # Inject previous-step summary to reduce context size
