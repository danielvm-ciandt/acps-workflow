schema_version: "1.0"

extension:
  id: "acps"
  name: "ACPS Workflow"
  version: "1.0.0"
  description: "CI&T Production System workflow with epic-backlog cycling, release planning, quality gates, scope management, release lifecycle, and BCP/FP/SNAP scope counting"
  author: "danielvm"
  repository: "https://github.com/danielvm/acps-workflow"
  license: "MIT"

requires:
  speckit_version: ">=0.1.0"
  commands:
    - "speckit.specify"
    - "speckit.plan"
    - "speckit.tasks"
    - "speckit.implement"

provides:
  commands:
    - name: "speckit.acps.setup"
      file: "commands/setup.md"
      description: "Bootstrap project environment, create AGENT.md and PROJECT_STATUS.md"
    - name: "speckit.acps.create-epic-backlog"
      file: "commands/create-epic-backlog.md"
      description: "Create ordered epic backlog in BACKLOG.md"
    - name: "speckit.acps.release-plan"
      file: "commands/release-plan.md"
      description: "Size backlog and create baseline scope in RELEASE_PLAN.md"
    - name: "speckit.acps.plan-bridge"
      file: "commands/plan-bridge.md"
      description: "Bridge baseline plan with technical plan from /speckit.plan"
    - name: "speckit.acps.test"
      file: "commands/test.md"
      description: "Run tests and produce TEST_SUMMARY.md with evidence"
    - name: "speckit.acps.bugfix"
      file: "commands/bugfix.md"
      description: "Record and fix failures in .specify/bugs/"
    - name: "speckit.acps.uat"
      file: "commands/uat.md"
      description: "User acceptance testing with verdict in .specify/uat/"
    - name: "speckit.acps.docs"
      file: "commands/docs.md"
      description: "Update documentation and refresh AGENT.md"
    - name: "speckit.acps.scope"
      file: "commands/scope.md"
      description: "Assess scope impact in .specify/scope/"
    - name: "speckit.acps.release"
      file: "commands/release.md"
      description: "Create release notes in CHANGELOG.md and releases/"
    - name: "speckit.acps.change-request"
      file: "commands/change-request.md"
      description: "Register change request in .specify/project/change-requests/"
    - name: "speckit.acps.count"
      file: "commands/count.md"
      description: "Assess scope using BCP, FP+SNAP, or simplified counting"

  config:
    - name: "acps-config.yml"
      template: "config/acps-config.template.yml"
      description: "ACPS workflow and counting configuration"
      required: false

hooks:
  after_tasks:
    command: "speckit.acps.plan-bridge"
    optional: true
    prompt: "Bridge baseline with technical plan?"
  after_implement:
    command: "speckit.acps.test"
    optional: true
    prompt: "Run workflow test summary?"
  after_specify:
    command: "speckit.acps.count"
    optional: true
    prompt: "Count scope (BCP/FP/SNAP) for this spec?"

tags:
  - "acps"
  - "cps"
  - "sdd"
  - "workflow"
  - "bcp"
  - "function-points"
  - "scope-counting"
  - "quality-gates"
