schema_version: "1.0"

extension:
  id: "acps"
  name: "ACPS Workflow"
  version: "2.0.0"
  description: "CI&T Production System workflow with epic-backlog cycling, release planning, quality gates, scope management, release lifecycle, and BCP/FP/SNAP scope counting — integrated with bigpowers skills"
  author: "danielvm"
  repository: "https://github.com/danielvm-ciandt/acps-workflow"
  license: "MIT"

provides:
  commands:
    - name: "acps.init"
      file: "commands/init.md"
      description: "Bootstrap project environment, governance, and specs/ structure"
    - name: "acps.backlog"
      file: "commands/backlog.md"
      description: "Create ordered epic backlog in specs/BACKLOG.md"
    - name: "acps.spec"
      file: "commands/spec.md"
      description: "Write spec, refine via dialogue, and auto-count scope (BCP/FP/SNAP)"
    - name: "acps.baseline"
      file: "commands/baseline.md"
      description: "Size backlog and create baseline scope contract in specs/RELEASE_PLAN.md"
    - name: "acps.plan"
      file: "commands/plan.md"
      description: "Technical plan → baseline bridge → task breakdown → optional analysis"
    - name: "acps.implement"
      file: "commands/implement.md"
      description: "TDD implementation: red → green → refactor per behavior slice"
    - name: "acps.test"
      file: "commands/test.md"
      description: "Run tests with evidence; quality gate before UAT or after acps.fix"
    - name: "acps.fix"
      file: "commands/fix.md"
      description: "Root-cause triage, fix, and re-verify failures from specs/bugs/"
    - name: "acps.uat"
      file: "commands/uat.md"
      description: "UAT execution + docs update (Phase 3)"
    - name: "acps.release"
      file: "commands/release.md"
      description: "Scope review (Phase 1) + semver bump + changelog + tag + publish"
    - name: "acps.cr"
      file: "commands/cr.md"
      description: "Register change request, assess impact, update specs/BACKLOG.md"

  config:
    - name: "acps-config.yml"
      template: "config/acps-config.template.yml"
      description: "ACPS workflow and counting configuration"
      required: false

hooks:
  after_spec:
    command: "acps.spec --count-only"
    optional: true
    prompt: "Recount scope (BCP/FP/SNAP) for this spec?"
  after_implement:
    command: "acps.test"
    optional: true
    prompt: "Run test suite and produce TEST_SUMMARY?"

tags:
  - "acps"
  - "cps"
  - "sdd"
  - "workflow"
  - "bcp"
  - "function-points"
  - "scope-counting"
  - "quality-gates"
  - "bigpowers"
  - "tdd"
